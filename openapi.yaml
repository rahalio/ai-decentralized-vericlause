components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
    FindingId:
      name: findingId
      in: path
      required: true
      schema:
        type: string
    WaiverId:
      name: waiverId
      in: path
      required: true
      schema:
        type: string
    GateId:
      name: gateId
      in: path
      required: true
      schema:
        type: string
    ArtefactId:
      name: artefactId
      in: path
      required: true
      schema:
        type: string
  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadRequest:
      description: Bad request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    ResponseMeta:
      type: object
      required:
      - requestId
      - timestamp
      properties:
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
    Problem:
      type: object
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
    ContractProject:
      type: object
      required:
      - id
      - name
      - status
      - language
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
          enum:
          - active
          - archived
        language:
          type: string
          enum:
          - solidity
          - vyper
          - other
        repoUri:
          type: string
          format: uri
    ContractProjectCreate:
      type: object
      required:
      - name
      - status
      - language
      properties:
        name:
          type: string
        status:
          type: string
          enum:
          - active
          - archived
        language:
          type: string
          enum:
          - solidity
          - vyper
          - other
        repoUri:
          type: string
          format: uri
    DataEnvelopeContractProject:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/ContractProject'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ListEnvelopeContractProject:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: object
          required:
          - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ContractProject'
            nextCursor:
              type: string
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    AnalysisJob:
      type: object
      required:
      - id
      - projectId
      - versionRef
      - jobType
      - status
      properties:
        id:
          type: string
        projectId:
          type: string
        versionRef:
          type: string
        jobType:
          type: string
          enum:
          - formalVerification
          - searchBasedTesting
          - combined
        status:
          type: string
          enum:
          - queued
          - running
          - succeeded
          - failed
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
    AnalysisJobCreate:
      type: object
      required:
