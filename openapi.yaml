      - id
      - jobId
      - severity
      - title
      - status
      properties:
        id:
          type: string
        jobId:
          type: string
        severity:
          type: string
          enum:
          - info
          - low
          - medium
          - high
          - critical
        title:
          type: string
        property:
          type: string
        trace:
          type: string
        status:
          type: string
          enum:
          - open
          - waived
          - fixed
          - acceptedRisk
    FindingCreate:
